<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1730" />
  <title>OWASP AppSec Days Portugal Registry</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #081120;
      --bg-soft: #0d1a30;
      --panel: rgba(13, 26, 48, .92);
      --panel-strong: #10213d;
      --text: #ffffff;
      --muted: #a9b7cf;
      --line: rgba(255,255,255,.14);
      --blue: #3795f6;
      --blue-strong: #1977dd;
      --violet: #6c42df;
      --danger: #ff776f;
      --success: #5ee6a8;
      --shadow: 0 18px 60px rgba(0,0,0,.34);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 80% 5%, rgba(55,149,246,.36), transparent 27rem),
        radial-gradient(circle at 15% 92%, rgba(108,66,223,.32), transparent 26rem),
        linear-gradient(155deg, #14223a 0%, #091321 52%, #100d2b 100%);
      background-attachment: fixed;
    }
    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    .app {
      width: min(100%, 720px);
      height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 50px;
    }
    .brand-mini {
      flex: 1;
      min-width: 0;
      font-weight: 900;
      letter-spacing: .02em;
      line-height: 1.08;
    }
    .brand-mini span { display: block; color: var(--muted); font-size: .72rem; font-weight: 700; margin-top: 3px; }
    .hero {
      padding: 10px 0 10px;
      text-align: center;
    }
    .event-logo {
      width: min(86%, 500px);
      height: auto;
      display: block;
      margin: 0 auto 10px;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,.24));
    }
    .card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(17,35,65,.94), rgba(9,22,42,.92));
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 12px;
    }
    #videoWrap {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #02050a;
      aspect-ratio: 16 / 10;
      max-height: 42dvh;
      border: 1px solid rgba(255,255,255,.1);
      cursor: pointer;
      outline: none;
    }
    #videoWrap:focus-visible {
      box-shadow: 0 0 0 3px rgba(55,149,246,.35);
      border-color: var(--blue);
    }
    #videoWrap.scanning { cursor: default; }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 22px;
      color: var(--muted);
      background:
        radial-gradient(circle at center, rgba(55,149,246,.13), transparent 55%),
        #07101d;
    }
    .camera-placeholder strong { color: white; display: block; margin-bottom: 5px; }
    .guide {
      position: absolute;
      inset: 24% 8%;
      border: 3px solid rgba(255,255,255,.93);
      border-radius: 15px;
      box-shadow: 0 0 0 999px rgba(0,0,0,.32);
      pointer-events: none;
      display: none;
    }
    .scanning .guide { display: block; }
    .scanning .camera-placeholder { display: none; }

    .result {
      text-align: center;
      padding: 4px 2px 2px;
      animation: resultIn .16s ease-out;
    }
    @keyframes resultIn {
      from { opacity: 0; transform: scale(.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .result-label {
      margin: 0 0 6px;
      color: var(--success);
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .result-digits {
      display: block;
      margin: 0;
      padding: 10px 6px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px;
      background: rgba(255,255,255,.07);
      color: white;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(2.6rem, 19vw, 5.6rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: .06em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .result-digits.unavailable {
      color: var(--danger);
      font-size: clamp(2rem, 12vw, 3.4rem);
    }
    .result-warning {
      margin: 10px 4px 0;
      color: var(--danger);
      font-size: .82rem;
      font-weight: 800;
      line-height: 1.4;
    }
    .result-warning:empty { display: none; }
    .result-full-label {
      margin: 14px 0 4px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 850;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .result-full {
      margin: 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .82rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .primary {
      width: 100%;
      min-height: 56px;
      margin-top: 14px;
      padding: 0 18px;
      border: 0;
      border-radius: 16px;
      color: white;
      font-size: 1.05rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--blue-strong), var(--violet));
      box-shadow: 0 12px 28px rgba(44,107,224,.29);
    }
    .scanner-panel[hidden], .result-panel[hidden] { display: none; }
    .status {
      min-height: 0;
      margin: 10px auto 0;
      max-width: 560px;
      padding: 0;
      border-radius: 13px;
      color: var(--muted);
      text-align: center;
      font-weight: 950;
      line-height: 1.35;
    }
    .status:not(:empty) {
      padding: 11px 14px;
      border: 1px solid currentColor;
      background: rgba(0,0,0,.38);
      box-shadow: 0 10px 28px rgba(0,0,0,.24);
    }
    .status.error { color: var(--danger); }
    .status.error:not(:empty) { background: rgba(180,35,24,.28); }

    @media (max-height: 760px) {
      .event-logo { width: min(76%, 430px); }
      .hero { padding: 6px 0; }
      .card { padding: 10px; }
      #videoWrap { max-height: 39dvh; }
    }
    @media (max-height: 660px) {
      .brand-mini span { display: none; }
      .event-logo { width: min(66%, 360px); margin-bottom: 6px; }
      #videoWrap { max-height: 36dvh; }
      .result-digits { font-size: clamp(2.2rem, 15vw, 4.2rem); }
    }
    @media (max-width: 410px) {
      .hero { padding-top: 16px; }
      .event-logo { margin-bottom: 17px; }
      .card { border-radius: 20px; }
    }
  </style>
</head>

      <div id="videoWrap" role="button" tabindex="0" aria-label="Tap here to scan a barcode">
        <video id="video" playsinline muted></video>
        <div class="camera-placeholder">
          <div><strong>Tap here to scan…</strong>Point the camera at a barcode.</div>
        </div>
        <div class="guide" aria-hidden="true"></div>
      </div>
    </div>

    <div id="resultPanel" class="result-panel" hidden>
      <div class="result" aria-live="assertive">
        <p class="result-label">Registration code</p>
        <strong id="resultDigits" class="result-digits"></strong>
        <p id="resultWarning" class="result-warning"></p>
        <p class="result-full-label">Full barcode</p>
        <p id="resultFull" class="result-full"></p>
      </div>
      <button id="scanAgainButton" class="primary" type="button">Scan another</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  // The badge barcode carries the registration code in characters 17 to 22.
  const DIGITS_START = 17;
  const DIGITS_END = 22;

  const $ = id => document.getElementById(id);
  const video = $("video");
  const videoWrap = $("videoWrap");
  const statusEl = $("status");
  const scannerPanel = $("scannerPanel");
  const resultPanel = $("resultPanel");
  const resultDigits = $("resultDigits");
  const resultWarning = $("resultWarning");
  const resultFull = $("resultFull");

  let stream = null;
  let detector = null;
  let BarcodeDetectorClass = null;
  let scanTimer = null;
  let scanning = false;
  let scanInProgress = false;

  function setStatus(message, type = "") {
    statusEl.textContent = message;
    statusEl.className = `status ${type}`.trim();
  }

  async function getBarcodeDetectorClass() {
    if (BarcodeDetectorClass) return BarcodeDetectorClass;

    if ("BarcodeDetector" in globalThis) {
      BarcodeDetectorClass = globalThis.BarcodeDetector;
      return BarcodeDetectorClass;
    }

    setStatus("Loading barcode scanner…");

    const module = await import(
      "https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/es/ponyfill.min.js"
    );

    BarcodeDetectorClass = module.BarcodeDetector;
    return BarcodeDetectorClass;
  }

  function showResult(rawValue) {
    const value = String(rawValue || "").trim();
    if (!value) return false;

    const digits = value.slice(DIGITS_START - 1, DIGITS_END);
    const complete = digits.length === DIGITS_END - DIGITS_START + 1;

    resultDigits.textContent = complete ? digits : "—";
    resultDigits.classList.toggle("unavailable", !complete);
    resultWarning.textContent = complete
      ? ""
      : `This barcode has only ${value.length} ${value.length === 1 ? "character" : "characters"}, so positions ${DIGITS_START}–${DIGITS_END} are not available.`;
    resultFull.textContent = value;

    scannerPanel.hidden = true;
    resultPanel.hidden = false;
    setStatus("");

    if (navigator.vibrate) navigator.vibrate(90);
    return true;
  }

  async function scanFrame() {
    if (!scanning || scanInProgress || !detector || video.readyState < 2) return;
    scanInProgress = true;

    try {
      const barcodes = await detector.detect(video);
      if (barcodes.length && showResult(barcodes[0].rawValue)) {
        stopCamera(true);
      }
    } catch (error) {
      console.debug("Frame scan failed:", error);
    } finally {
      scanInProgress = false;
    }
  }

  async function startCamera() {
    if (scanning) return;

    if (!window.isSecureContext) {
      setStatus("Camera access requires HTTPS or localhost.", "error");
      return;
    }

    try {
      videoWrap.classList.add("scanning");
      videoWrap.setAttribute("aria-label", "Scanning for a barcode");

      const DetectorClass = await getBarcodeDetectorClass();
      const requestedFormats = [
        "aztec", "code_128", "code_39", "code_93", "codabar",
        "data_matrix", "ean_13", "ean_8", "itf", "pdf417",
        "qr_code", "upc_a", "upc_e"
      ];

      let formats = requestedFormats;
      if (typeof DetectorClass.getSupportedFormats === "function") {
        const supportedFormats = await DetectorClass.getSupportedFormats();
        formats = requestedFormats.filter(format => supportedFormats.includes(format));
      }

      detector = new DetectorClass(formats.length ? { formats } : undefined);

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();
      scanning = true;
      setStatus("Point the camera at a barcode.");
      scanTimer = window.setInterval(scanFrame, 220);
    } catch (error) {
      console.error(error);
      stopCamera(true);
      const message = error?.message || "Unknown error";
      setStatus(`Unable to start scanner: ${message}`, "error");
    }
  }

  function stopCamera(preserveStatus = false) {
    scanning = false;
    scanInProgress = false;
    if (scanTimer) clearInterval(scanTimer);
    scanTimer = null;
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null;
    video.srcObject = null;
    videoWrap.classList.remove("scanning");
    videoWrap.setAttribute("aria-label", "Tap here to scan a barcode");
    if (!preserveStatus) setStatus("");
  }

  function scanAgain() {
    resultPanel.hidden = true;
    scannerPanel.hidden = false;
    startCamera();
  }

  videoWrap.addEventListener("click", startCamera);
  videoWrap.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      startCamera();
    }
  });

  $("scanAgainButton").addEventListener("click", scanAgain);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && stream) stopCamera();
  });
  window.addEventListener("beforeunload", stopCamera);
})();
</script>
</body>
</html>
